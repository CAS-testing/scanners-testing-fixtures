name: pipeline-tools-false-positive-sast
# Fixture for XSUP-74465: tests that commands containing "if" as a substring
# (e.g. keyvaultName, notify, verify_config) do NOT trigger false-positive
# SAST coverage detection via the "if" catalog entry (regex: "if").
#
# BEFORE fix: this pipeline would be marked as SAST-covered because
#   "keyvaultName".match(/if/i) === truthy
# AFTER fix: word-boundary matching (\bif\b) prevents the false positive.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Azure Key Vault
        run: |
          keyvaultName=my-production-vault
          echo "Connecting to vault: $keyvaultName"

      - name: Notify deployment status
        run: |
          notify "Deployment started"
          echo "Notification sent"

      - name: Verify configuration
        run: |
          verify_config=true
          echo "Config verified: $verify_config"
